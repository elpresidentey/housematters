<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Matters - Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #424242;
            background-color: #ffffff;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        
        .navbar {
            background-color: #ffffff;
            border-bottom: 1px solid #eeeeee;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }
        
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
        }
        
        .nav-brand h1 {
            font-size: 1.5rem;
            font-weight: 900;
            color: #FF385C;
            letter-spacing: -0.02em;
        }
        
        .hero {
            padding-top: 120px;
            padding-bottom: 5rem;
            background: linear-gradient(135deg, #fafafa 0%, #ffffff 100%);
            text-align: center;
        }
        
        .hero-title {
            font-size: 3rem;
            font-weight: 700;
            color: #212121;
            margin-bottom: 1.5rem;
            line-height: 1.25;
            letter-spacing: -0.02em;
        }
        
        .hero-subtitle {
            font-size: 1.25rem;
            color: #757575;
            margin-bottom: 2.5rem;
            line-height: 1.625;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 16px 32px;
            border: 1px solid transparent;
            border-radius: 0.5rem;
            font-size: 1.125rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            min-height: 56px;
            margin: 0 0.5rem;
        }
        
        .btn-primary {
            background-color: #FF385C;
            color: #ffffff;
            border-color: #FF385C;
        }
        
        .btn-primary:hover {
            background-color: #E31C5F;
            border-color: #E31C5F;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(255, 56, 92, 0.3);
        }
        
        .btn-outline {
            background-color: #ffffff;
            color: #616161;
            border: 1px solid #e0e0e0;
        }
        
        .btn-outline:hover {
            background-color: #fafafa;
            border-color: #bdbdbd;
            color: #212121;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        @media (max-width: 768px) {
            .hero-title {
                font-size: 2rem;
            }
            
            .hero-subtitle {
                font-size: 1rem;
            }
            
            .btn {
                display: block;
                width: 100%;
                max-width: 280px;
                margin: 0.5rem auto;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <h1>House Matters</h1>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <h1 class="hero-title">Find your next home</h1>
            <p class="hero-subtitle">Connect directly with property owners and renters. Skip the middleman, save on fees, and discover your perfect place to call home.</p>
            
            <div class="hero-actions">
                <button class="btn btn-primary">Search properties</button>
                <button class="btn btn-outline">List your property</button>
            </div>
        </div>
    </section>

    <script>
        console.log('House Matters test page loaded successfully!');
        
        // Test button interactions
        document.querySelectorAll('.btn').forEach(button => {
            button.addEventListener('click', function() {
                console.log('Button clicked:', this.textContent);
                alert('Button works! ' + this.textContent);
            });
        });
    </script>
</body>
</html>
